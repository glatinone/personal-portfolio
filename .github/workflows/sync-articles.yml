name: Sync articles from devto-autopublish

# Triggered 3 ways:
#  1. Push to main in devto-autopublish fires a repository_dispatch here
#  2. Schedule: every 6 hours as a reliable fallback
#  3. workflow_dispatch: manual trigger from the Actions tab
on:
  repository_dispatch:
    types: [articles-updated]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        run: node scripts/sync-articles.mjs
        env:
          # Optional: provide a GitHub PAT for higher rate limits (60 → 5000 req/h)
          # Add SYNC_TOKEN secret in repo settings if you hit rate limits
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Commit synced articles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git diff --staged --quiet && echo "No article changes to commit." || (
            git commit -m "sync: pull articles from devto-autopublish [skip ci]"
            git push
          )
